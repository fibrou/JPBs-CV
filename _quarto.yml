project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - research.qmd
    - papers.qmd
    - cv.qmd
  resources:
    - /jpbDataDrivenCV.pdf
    - /jaafGalaPic.jpg

website:
  title: "J.P. Broussard, PhD"
  site-url: https://fibrou.github.io/JPBs-CV/
  description: "Finance Professor · Academic Administrator · Applied Financial Researcher"

  navbar:
    background: "#900000"
    foreground: white
    title: "John Paul Broussard"
    left:
      - text: "About"
        href: index.qmd
      - text: "Research"
        menu:
          - text: "Publications & Activity"
            href: research.qmd
          - text: "Working Papers"
            href: papers.qmd
      - text: "CV"
        href: cv.qmd
    right:
      - icon: github
        href: https://github.com/fibrou
        aria-label: GitHub
      - icon: linkedin
        href: https://tinyurl.com/5bfex8hv
        aria-label: LinkedIn

  page-footer:
    left: "© 2026 John Paul Broussard, PhD, CFA, FRM, PRM"
    center: "Built with [Quarto](https://quarto.org) · [GitHub Pages](https://pages.github.com)"
    right: "Willis, TX · [john.broussard@rutgers.edu](mailto:john.broussard@rutgers.edu)"
    background: "#f5f5f5"
    foreground: "#555555"

format:
  html:
    theme:
      - cosmo
      - custom-cv.scss
    toc: false
    link-external-newwindow: true

execute:
  echo: false
  warning: false
  message: false

# ── Publishing ─────────────────────────────────────────────────────────────
# Run ./publish.sh. It renders the PDF and this site from cv-app-test/cv.db,
# commits your source changes, and runs `quarto publish gh-pages`, which
# pushes the built site to the gh-pages branch that GitHub Pages serves.
